media:
  - name: images
    label: Images
    input: public/images
    output: /images
    categories: [image]
    rename: safe
  - name: audio
    label: Audio
    input: public/audio
    output: /audio
    extensions: [mp3, m4a, ogg, wav]
    rename: safe

  - name: videos
    label: Video clips (under 25 MiB)
    input: public/videos
    output: /videos
    extensions: [mp4, webm]
    rename: safe

content:
  - name: categories
    label: Categories
    type: collection
    path: src/content/categories
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [name]
    fields:
      - name: name
        label: Name
        type: string
        required: true

  - name: posts
    label: Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, category, pubDate, draft]
      sort: [pubDate, title]
      search: [title, description, category]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Short description
        type: text
        required: true
        description: A short summary shown in the post list and sharing previews.

      - name: category
        label: Category
        type: reference
        description: Optional. Pick an existing category, or add one under Categories first.
        options:
          collection: categories
          value: "{primary}"
          label: "{primary}"
          search: name

      - name: pubDate
        label: Post date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: heroImage
        label: Post thumbnail
        type: image
        description: Optional image for the post header, blog list, and sharing previews.
        options:
          media: images

      - name: heroImageAlt
        label: Thumbnail description
        type: string
        description: Briefly describe the image for people using screen readers.

      - name: audioFile
        label: Audio clip above post
        type: file
        description: Optional player above the post. To place clips within the writing, upload them in Media → Audio and paste each URL in its own paragraph.
        options:
          media: audio
          extensions: [mp3, m4a, ogg, wav]

      - name: draft
        label: Draft
        type: boolean
        default: true
        description: Keep enabled while writing. Save on the preview branch and check https://bcruz97-preview.bcruz97.workers.dev after the build. Turn off and merge to main to publish. Reading time is automatic.

      - name: body
        label: Post
        description: Insert images at the cursor with the image button. Put an audio, video clip, image, or YouTube link in its own paragraph to embed it on the blog.
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          switcher: true

actions:
  - name: rebuild-preview
    label: Rebuild private preview
    workflow: preview.yml
    ref: current
    confirm:
      title: Rebuild preview?
      message: Use this on the preview branch. Saving already triggers a build; this retries it.
      button: Rebuild
  - name: publish-pr
    label: Open publishing pull request
    workflow: publish-pr.yml
    ref: current
    confirm:
      title: Ready to review?
      message: Opens a pull request from preview to main. Review and merge it on GitHub to update the live blog.
      button: Open pull request

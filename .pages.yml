media:
  - name: images
    label: Images
    input: public/images
    output: /images
    categories: [image]
    rename: safe
  - name: audio
    label: Audio
    input: public/audio
    output: /audio
    extensions: [mp3, m4a, ogg, wav]
    rename: safe

content:
  - name: posts
    label: Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, pubDate, draft]
      sort: [pubDate, title]
      search: [title, description]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Short description
        type: text
        required: true
        description: A short summary shown in the post list and sharing previews.

      - name: pubDate
        label: Post date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: heroImage
        label: Post thumbnail
        type: image
        description: Optional image for the post header, blog list, and sharing previews.
        options:
          media: images

      - name: heroImageAlt
        label: Thumbnail description
        type: string
        description: Briefly describe the image for people using screen readers.

      - name: audioFile
        label: Audio clip
        type: file
        description: Optional audio player shown above the post. Supports MP3, M4A, OGG, and WAV.
        options:
          media: audio
          extensions: [mp3, m4a, ogg, wav]

      - name: readingTime
        label: Reading time (minutes)
        type: number
        default: 2
        options:
          min: 1

      - name: draft
        label: Draft
        type: boolean
        default: true
        description: Keep enabled while writing. Preview after saving at https://bcruz97.com/preview/ — turn off when ready to publish.

      - name: body
        label: Post
        description: Put a YouTube link on its own line to embed the video on the blog.
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          switcher: true
